<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet History</title>
<meta name="description" content="Every growth stage of the current study companion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/pet-registry.js"></script>
<script src="assets/pet-schedule.js"></script>
</head>
<body>

<nav class="topnav">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">English Learning Records · <span>Pet History</span></a>
    <div class="nav-links">
      <a class="back" href="index.html">← All records</a>
      <a href="pet-history.html">Pet history</a>
    </div>
  </div>
</nav>

<header class="hero">
  <h1 id="petHistoryTitle">Pet History</h1>
  <p class="subtitle">Every stage of growth, side by side</p>
  <p class="meta" id="petHistoryMeta">—</p>
</header>

<section style="padding-top: 8px;">
  <p class="history-intro" id="petHistoryIntro">—</p>
</section>

<div class="stages-grid" id="stagesGrid"></div>

<button class="back-to-top" id="backToTop" aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="19" x2="12" y2="5"></line>
    <polyline points="5 12 12 5 19 12"></polyline>
  </svg>
</button>

<script>
  function escapeText(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function currentMonthKey() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  }

  function resolveSpecies() {
    const param = new URLSearchParams(location.search).get('species');
    if (param) return param;
    const key = currentMonthKey();
    const fromSchedule = window.PET_SCHEDULE && window.PET_SCHEDULE[key];
    return fromSchedule || window.PET_SCHEDULE_DEFAULT;
  }

  function renderStageCard(species, stageData, idx, currentStage) {
    const locked = idx > currentStage;
    const current = idx === currentStage;
    const cls = ['stage-card'];
    if (locked) cls.push('locked');
    if (current) cls.push('current');
    const threshold = stageData.threshold;
    const thresholdText = locked
      ? `Unlock at ${threshold} practice${threshold === 1 ? '' : 's'}`
      : (stageData.thresholdLabel || `${threshold}+ practices`);
    const features = (stageData.features || [])
      .map(f => `      <li><span class="check">✓</span> ${escapeText(f)}</li>`)
      .join('\n');
    return `<article class="${cls.join(' ')}" data-stage-index="${idx}" data-threshold="${threshold}">
    <span class="stage-badge">Stage ${idx}</span>
    <h3 class="stage-name">${escapeText(stageData.name)}</h3>
    <div class="stage-card-pet">
      <div class="pet-container" data-species="${species}" data-stage="${idx}"></div>
    </div>
    <p class="stage-threshold">${escapeText(thresholdText)}</p>
    <p class="stage-desc">${escapeText(stageData.desc || stageData.message || '')}</p>
    <ul class="stage-features">
${features}
    </ul>
  </article>`;
  }

  function mountHistory(species) {
    const def = window.PetRegistry.get(species);
    if (!def) {
      document.getElementById('petHistoryTitle').textContent = 'Pet not found';
      document.getElementById('stagesGrid').innerHTML =
        '<p style="text-align:center; color: var(--text-muted);">No pet registered for species <code>' +
        escapeText(species) + '</code>.</p>';
      return;
    }

    document.title = `Pet History · ${def.historyTitle || def.displayName}`;
    document.getElementById('petHistoryTitle').textContent =
      `Pet History · ${def.historyTitle || def.displayName}`;
    document.getElementById('petHistoryIntro').innerHTML =
      def.historyIntroHtml || 'Each stage unlocks something new as you log more practice records.';

    // Try to read the count saved by the index page; otherwise default to 0.
    let count = 0;
    try {
      const cached = localStorage.getItem('currentMonthPracticeCount');
      const cachedSpecies = localStorage.getItem('currentMonthPetSpecies');
      // Only trust the cached count if it's for this same species (and viewing
      // current-month species). For other species, show all-locked-past-stage-0.
      if (cached !== null && (!cachedSpecies || cachedSpecies === species)) {
        count = parseInt(cached, 10) || 0;
      }
    } catch (_) {}

    const currentStage = window.PetRegistry.stageForCount(species, count);

    // Meta line: which month this companion belongs to
    const scheduleEntry = Object.entries(window.PET_SCHEDULE || {})
      .find(([, sp]) => sp === species);
    if (scheduleEntry) {
      const [ym] = scheduleEntry;
      const [y, m] = ym.split('-').map(Number);
      const monthName = new Date(y, m - 1, 1).toLocaleString('en-US', { month: 'long' });
      document.getElementById('petHistoryMeta').textContent = `${monthName} ${y} companion`;
    } else {
      document.getElementById('petHistoryMeta').textContent = `${def.displayName}`;
    }

    const grid = document.getElementById('stagesGrid');
    grid.innerHTML = def.stages
      .map((s, idx) => renderStageCard(species, s, idx, currentStage))
      .join('\n');

    // Inject the SVG into every unlocked card. Locked cards stay empty —
    // CSS handles the mystery placeholder.
    grid.querySelectorAll('.stage-card').forEach(card => {
      if (card.classList.contains('locked')) return;
      const container = card.querySelector('.pet-container');
      if (!container) return;
      // The container already has data-species + data-stage; render just the SVG.
      container.innerHTML = def.svg;
    });
  }

  function initBackToTop() {
    const backBtn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      backBtn.classList.toggle('visible', window.scrollY > 400);
    });
    backBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  window.loadAllPets().then(() => {
    mountHistory(resolveSpecies());
    initBackToTop();
  }).catch(err => {
    console.error('Failed to load pets:', err);
    initBackToTop();
  });
</script>

</body>
</html>
